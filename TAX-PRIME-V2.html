e="research">Public research workspace</option></select><select id="role" onchange="setRole(this.value)"><option>Analyst</option><option>Reviewer</option><option>Administrator</option></select><button onclick="go(8)">✧ Copilot</button></header><section id="content"></section></main><div class="toast" id="toast"></div><input type="file" id="file" accept=".csv,.json" hidden><script>
const names=['Executive Dashboard','Data Integration Hub','Tax Data Explorer','Risk Modeling Studio','Predictive Intelligence','Scenario Simulation Lab','Prioritization Engine','Decision Optimization','Groq AI Copilot','Governance and Audit','Reports & Publications','Performance Validation'];const groups={0:'COMMAND CENTER',1:'DATA FOUNDATION',3:'01 · MODEL',4:'02 · PREDICT',6:'03 · ASSESS & PRIORITIZE',8:'04 · DELIVER',11:'CONTINUOUS LEARNING'};const icons=['▦','▤','⌕','◇','↗','◉','≡','⊞','✧','✓','▧','⟳'];const sources=[['Treasury Revenue Collections','https://fiscaldata.treasury.gov/datasets/revenue-collections-management/','Public API','treasury-rcm'],['Monthly Treasury Statement','https://fiscaldata.treasury.gov/','Public API','treasury-mts'],['IRS SOI / Data Book','https://www.irs.gov/statistics/soi-tax-stats-irs-data-book','Published files','irs-soi'],['Census ACS / CBP','https://www.census.gov/data/developers/','Dataset API','census'],['FRED / ALFRED','https://fred.stlouisfed.org/docs/api/fred/','Key required','fred']];

function digest(t){let h=0;for(let i=0;i<t.length;i++)h=(Math.imul(31,h)+t.charCodeAt(i))|0;return (h>>>0).toString(16)}
async function fiscalPages(url,max=12){let page=1,all=[];for(;;){let u=url+(url.includes('?')?'&':'?')+'page[number]='+page+'&page[size]=10000';let r=await fetch(u);if(!r.ok)throw Error('Treasury API HTTP '+r.status);let j=await r.json();all=all.concat(j.data||[]);let pages=j.meta?.total_pages||1;if(!j.data?.length||page>=pages||page>=max)break;page++}return all}
async function syncTreasuryRCM(){let y=cfg.treasuryFromYear||2018,u=`${FISCAL}/v2/revenue/rcm?filter=record_calendar_year:gte:${y}&fields=record_date,net_collections_amt,record_calendar_year,record_calendar_month`;toast('Fetching Treasury revenue collections…');let rows=await fiscalPages(u);let by=new Map;for(let r of rows){let mo=String(r.record_calendar_month).padStart(2,'0'),k=`${r.record_calendar_year}-${mo}`,v=by.get(k)||0;by.set(k,v+Number(r.net_collections_amt))}let out=[...by.entries()].map(([date,value])=>({date,value:Math.round(value)})).filter(r=>/^\d{4}-(0[1-9]|1[0-2])$/.test(r.date)&&Number.isFinite(r.value)&&r.value>0).sort((a,b)=>a.date.localeCompare(b.date));if(out.length<12)throw Error('Treasury sync returned insufficient months.');let raw=JSON.stringify(out),sid='TRS-'+id();s.source.push({id:sid,name:'Treasury RCM (API aggregate)',date:now(),count:out.length,checksum:digest(raw),connector:'treasury-rcm'});s.obs=out.map(r=>({date:r.date,value:r.value,source:sid}));s.connectors['treasury-rcm']={status:'Connected',lastSync:now(),rows:out.length,checksum:digest(raw)};log('Treasury RCM sync',sid);return out.length}
async function syncFredMacro(){let key=cfg.fredKey?.trim();if(!key)throw Error('FRED API key required (stored locally on this device).');let sid=cfg.fredSeries||'GDP',u=`https://api.stlouisfed.org/fred/series/observations?series_id=${encodeURIComponent(sid)}&api_key=${encodeURIComponent(key)}&file_type=json&observation_start=2018-01-01`;toast('Fetching FRED macro series…');let r=await fetch(u);if(!r.ok)throw Error('FRED HTTP '+r.status);let j=await r.json();let pts=(j.observations||[]).map(o=>({date:o.date.slice(0,7),value:Number(o.value)})).filter(o=>Number.isFinite(o.value));s.macro={series:sid,points:pts,date:now()};s.connectors.fred={status:'Connected',lastSync:now(),rows:pts.length,checksum:digest(JSON.stringify(pts))};log('FRED macro sync',sid);return pts.length}
async function syncSource(cid){try{if(cid==='treasury-rcm'){let n=await syncTreasuryRCM();toast('Treasury sync: '+n+' monthly points');render()}else if(cid==='fred'){let n=await syncFredMacro();toast('FRED sync: '+n+' observations');render()}else toast('Use file import for this source in V2 prototype.')}catch(e){s.connectors[cid]={status:'Error',lastSync:now(),error:e.message};save();toast(e.message);render()}}
function workspaceContext(){let r=latest(),sc=s.scenarios[0],o=s.opt;return JSON.stringify({mode:space,role,observations:s.obs.length,observationRange:s.obs[0]?.date+' … '+s.obs.at(-1)?.date,sourceSnapshots:s.source.slice(0,8),latestRun:r?{id:r.id,method:r.method,horizon:r.h,first:r.values[0],total:r.values.reduce((a,b)=>a+b,0)}:null,latestScenario:sc?{id:sc.id,name:sc.name,shock:sc.shock,growth:sc.growth}:null,optimization:o?{id:o.id,selected:o.ids.length,capacity:o.capacity,value:o.value}:null,model:s.model,macro:s.macro?.series?s.macro:null,limitations:'Aggregate public research only. No individual taxpayer data. LLM must not invent numbers.'},null,0)}
async function groqExplain(q){let key=cfg.groqKey?.trim();if(!key)throw Error('Add Groq API key in Data Integration Hub (stored locally).');let sys='You are TAX-PRIME research copilot. Answer only from WORKSPACE_CONTEXT JSON. Cite source snapshot IDs when mentioning data. If context lacks information, say so. Never claim operational tax authority. Keep answers concise.';let body={model:cfg.groqModel||'llama-3.3-70b-versatile',temperature:0.2,messages:[{role:'system',content:sys},{role:'user',content:'WORKSPACE_CONTEXT:\n'+workspaceContext()+'\n\nQUESTION:\n'+q}]};let res=await fetch(GROQ_URL,{method:'POST',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!res.ok){let err=await res.text();throw Error('Groq HTTP '+res.status+': '+err.slice(0,120))}let j=await res.json();return j.choices?.[0]?.message?.content?.trim()||'No response.'}
function persistSettings(){cfg.groqKey=input('groqKey').trim();cfg.groqModel=input('groqModel').trim()||'llama-3.3-70b-versatile';cfg.fredKey=input('fredKey').trim();cfg.fredSeries=input('fredSeries').trim()||'GDP';cfg.treasuryFromYear=Math.max(2000,Math.min(2030,n('treasuryFrom')||2018));saveSettingsObj(cfg);toast('Integration settings saved locally')}const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=x=>Number.isFinite(x)?'$'+x.toLocaleString('en-US',{maximumFractionDigits:0}):'N/A',num=x=>Number.isFinite(x)?x.toLocaleString('en-US',{maximumFractionDigits:2}):'N/A', now=()=>new Date().toISOString(),id=()=>Math.random().toString(36).slice(2,10);let page=0,space='demo',role='Analyst',s;function fresh(demo){let obs=demo?Array.from({length:48},(_,i)=>({date:`${2022+Math.floor(i/12)}-${String(i%12+1).padStart(2,'0')}`,value:Math.round(250000000000+i*1500000000+45000000000*Math.sin(i*Math.PI/6)),source:'SYN-001'})):[];let cases=demo?Array.from({length:24},(_,i)=>({id:'SIM-'+String(i+1).padStart(3,'0'),p:(20+(i*17)%70)/100,value:5000+(i*7291)%45000,cost:300+(i*137)%1200,hours:2+i%7,burden:1+i%5})):[];return {obs,cases,source:demo?[{id:'SYN-001',name:'Seeded monthly revenue series',date:now(),count:48}]:[],runs:[],scenarios:[],decisions:[],audit:[],reports:[],evaluations:[],model:{name:'Seasonal baseline',version:1,features:'Historical aggregate receipts; month of year',notes:'No individual identifiers or inferred misconduct'},opt:null,chat:[],macro:null,connectors:{}}}function migrate(x){if(!x.connectors)x.connectors={};if(!('macro' in x))x.macro=null;return x}function load(){try{s=migrate(JSON.parse(localStorage.getItem('taxprime-'+space))||fresh(space==='demo'))}catch{s=fresh(space==='demo')}cfg=loadSettings()}function save(){try{localStorage.setItem('taxprime-'+space,JSON.stringify(s))}catch(e){toast('Local storage full or unavailable')}}function log(action,detail=''){s.audit.unshift({date:now(),actor:role,action,detail});save()}function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2600)}function go(i){page=i;render()}function switchSpace(v){space=v;load();page=0;render()}function setRole(v){role=v;render()}function btn(t,fn,primary=false){return `<button ${primary?'class="primary"':''} onclick="${fn}">${t}</button>`}function card(t,b){return `<div class="card"><h2>${t}</h2>${b}</div>`}function metric(t,v,n=''){return `<div class="card"><small>${t}</small><div class="metric">${v}</div><small>${n}</small></div>`}function table(head,rows){return `<div class="scroll"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${head.length}" class="empty">No records yet.</td></tr>`}</tbody></table></div>`}function field(t,i,v,type='number',extra=''){return `<label>${t}<input id="${i}" type="${type}" value="${esc(v)}" ${extra}></label>`}function chart(vals,other=[]){if(!vals.length)return '<p class="empty">Import observations to visualize trends.</p>';let all=[...vals,...other].filter(Number.isFinite),max=Math.max(...all),min=Math.min(...all),range=max-min||1,W=680,H=230,pt=(v,i)=>`${40+i*(W-60)/Math.max(vals.length-1,other.length-1,1)},${H-28-(v-min)/range*(H-55)}`;return `<svg class="chart" viewBox="0 0 ${W} ${H}">${[0,1,2,3,4].map(i=>`<line x1="40" x2="660" y1="${25+i*44}" y2="${25+i*44}" stroke="#e0e8ee"/><text x="3" y="${29+i*44}" font-size="9" fill="#6a8190">${num((max-i*range/4)/1e9)}B</text>`).join('')}<polyline fill="none" stroke="#187d85" stroke-width="3" points="${vals.map(pt).join(' ')}"/>${other.length?`<polyline fill="none" stroke="#d99745" stroke-width="3" stroke-dasharray="6 4" points="${other.map(pt).join(' ')}"/>`:''}<text x="40" y="222" font-size="10" fill="#64778a">Earlier</text><text x="620" y="222" font-size="10" fill="#64778a">Later</text></svg>`}function download(name,text,type='application/json'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportAll(){download('tax-prime-'+space+'.json',JSON.stringify(s,null,2));toast('Workspace exported')}function input(id){return $(id).value}function n(id){return Number(input(id))}function valid(x){return Number.isFinite(x)}function latest(){return s.runs[0]}function forecast(data,method,h){let a=data.map(x=>x.value),out=[];if(a.length<12)throw Error('At least 12 monthly observations required.');for(let i=0;i<h;i++){let v=method==='Seasonal naïve'?a[a.length-12]:method==='Moving average'?a.slice(-6).reduce((x,y)=>x+y,0)/6:a[a.length-1];out.push(v);a.push(v)}return out}function runForecast(){try{let h=n('horizon');if(!Number.isInteger(h)||h<1||h>24)throw Error('Choose 1–24 months.');let method=input('method'),f=forecast(s.obs,method,h),errors=s.obs.slice(12).map((o,i)=>o.value-s.obs[i].value),sigma=Math.sqrt(errors.reduce((a,b)=>a+b*b,0)/Math.max(1,errors.length)),r={id:id(),date:now(),method,h,values:f,low:f.map(x=>Math.max(0,x-1.96*sigma)),high:f.map(x=>x+1.96*sigma),source:s.source.map(x=>x.id),version:s.model.version};s.runs.unshift(r);log('Forecast created',r.id);render();toast('Versioned forecast saved')}catch(e){toast(e.message)}}function scenario(){let r=latest(),shock=n('shock'),growth=n('growth');if(!r||!valid(shock)||!valid(growth)||shock< -100||growth< -100)return toast('Run a forecast and enter valid percentages.');let v=r.values.map((x,i)=>x*(1+shock/100)*Math.pow(1+growth/100,i/12));s.scenarios.unshift({id:id(),name:input('sname')||'Scenario',run:r.id,shock,growth,values:v,date:now()});log('Scenario saved',s.scenarios[0].id);render()}function score(c,lambda=100){return c.p*c.value-c.cost-lambda*c.burden}function solve(){let T=n('capacity'),lambda=n('penalty');if(!Number.isInteger(T)||T<0||T>2000||!valid(lambda)||lambda<0)return toast('Capacity must be an integer 0–2000; penalty nonnegative.');let dp=Array.from({length:T+1},()=>({v:0,ids:[]}));for(let c of s.cases){for(let t=T;t>=c.hours;t--){let v=dp[t-c.hours].v+score(c,lambda);if(v>dp[t].v)dp[t]={v,ids:[...dp[t-c.hours].ids,c.id]}}}let best=dp[T];s.opt={id:id(),capacity:T,lambda,ids:best.ids,value:best.v,hours:s.cases.filter(c=>best.ids.includes(c.id)).reduce((a,c)=>a+c.hours,0),date:now()};log('Synthetic optimization',s.opt.id);render()}function addCase(){let p=n('prob')/100,value=n('value'),cost=n('cost'),hours=n('hours'),burden=n('burden');if(![p,value,cost,hours,burden].every(valid)||p<0||p>1||value<0||cost<0||hours<1||!Number.isInteger(hours)||burden<0)return toast('Invalid synthetic inputs');s.cases.push({id:'SIM-'+id(),p,value,cost,hours,burden});s.opt=null;log('Synthetic case added');render()}function saveModel(){let name=input('mname').trim();if(!name)return toast('Model name required');s.model={name,version:s.model.version+1,features:input('features'),notes:input('notes')};log('Model specification revised','v'+s.model.version);render()}function submit(){let r=latest(),sc=s.scenarios[0];if(!r)return toast('Create a forecast first');let rationale=input('rationale').trim();if(!rationale)return toast('Enter decision rationale');s.decisions.unshift({id:id(),run:r.id,scenario:sc?.id||null,status:'Submitted',rationale,date:now(),review:''});log('Decision submitted',s.decisions[0].id);render()}function review(i,status){if(role!=='Reviewer')return toast('Switch to simulated Reviewer role');let reason=input('review-'+i).trim();if(!reason)return toast('Reviewer rationale required');s.decisions[i].status=status;s.decisions[i].review=reason;s.decisions[i].reviewed=now();log('Review '+status,s.decisions[i].id);render()}function evaluate(){let a=s.obs;if(a.length<24)return toast('At least 24 observations required for chronological holdout');let k=a.length-12,train=a.slice(0,k),actual=a.slice(k).map(o=>o.value),prediction=forecast(train,'Seasonal naïve',12),alt=forecast(train,'Moving average',12);function metrics(p){let e=p.map((v,i)=>v-actual[i]);return {mae:e.reduce((a,b)=>a+Math.abs(b),0)/12,rmse:Math.sqrt(e.reduce((a,b)=>a+b*b,0)/12),smape:p.reduce((a,v,i)=>a+(Math.abs(v)+Math.abs(actual[i])?200*Math.abs(v-actual[i])/(Math.abs(v)+Math.abs(actual[i])):0),0)/12}}s.evaluations.unshift({id:id(),date:now(),baseline:metrics(prediction),alternate:metrics(alt),cutoff:train.at(-1).date,actual,prediction,alt});log('Holdout evaluation saved',s.evaluations[0].id);render()}async function copilot(){let q=input('question').trim();if(!q)return;let a,engine='local';if(cfg.groqKey?.trim()){try{toast('Groq generating…');a=await groqExplain(q);engine='groq';log('Groq explanation',engine)}catch(e){toast(e.message);return}}else{let r=latest(),sc=s.scenarios[0];if(/optim|capacity|priorit/i.test(q))a=s.opt?`Synthetic optimizer ${s.opt.id} selected ${s.opt.ids.length} cases using ${s.opt.hours} of ${s.opt.capacity} staff hours. Modeled net value ${money(s.opt.value)}. Fictional allocation only.`:'No optimization run available.';else if(/scenario|shock/i.test(q))a=sc?`Scenario ${sc.id} applies ${sc.shock}% shock and ${sc.growth}% annual growth to forecast ${sc.run}. Modeled total: ${money(sc.values.reduce((x,y)=>x+y,0))}.`:'No saved scenario.';else a=r?`Run ${r.id}: ${r.method}, ${r.h} months. First forecast ${money(r.values[0])}. Sources: ${r.source.join(', ')}.`:'Import observations and create a forecast first.';log('Local template explanation')}s.chat.unshift({q,a,date:now(),engine});render();toast(engine==='groq'?'Groq response saved':'Local explanation saved')}function makeReport(){let d=s.decisions.find(x=>x.status==='Approved');if(!d)return toast('A simulated reviewer approval is required');let r=s.runs.find(x=>x.id===d.run),sc=s.scenarios.find(x=>x.id===d.scenario);if(!r)return toast('Missing run');s.reports.unshift({id:id(),date:now(),decision:d.id,run:r.id,scenario:sc?.id||null,mode:space,method:r.method,total:r.values.reduce((a,b)=>a+b,0),source:r.source,rationale:d.rationale,review:d.review});log('Report generated',s.reports[0].id);render()}function reportText(r){return `TAX-PRIME V2 | Research decision brief\nGenerated: ${r.date}\nMode: ${r.mode}\nDecision: ${r.decision}\nForecast: ${r.run}\nScenario: ${r.scenario||'None'}\nMethod: ${r.method}\nModeled total: ${money(r.total)}\nSource snapshots: ${r.source.join(', ')}\nRationale: ${r.rationale}\nReview: ${r.review}\nResearch only. No operational tax decision or validated impact.`}function importFile(){ $('file').click()}$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let txt=await f.text(),rows;if(f.name.endsWith('.json'))rows=JSON.parse(txt);else{let lines=txt.trim().split(/\r?\n/);if(lines.shift().trim().toLowerCase()!=='date,value')throw Error('CSV header must be date,value');rows=lines.map(l=>{let [date,value]=l.split(',');return {date,value:Number(value)}})}if(!Array.isArray(rows)||!rows.length||rows.some(r=>!/^\d{4}-(0[1-9]|1[0-2])$/.test(r.date)||!Number.isFinite(Number(r.value))||Number(r.value)<0||Object.keys(r).some(k=>!['date','value'].includes(k))))throw Error('Only aggregate monthly date/value rows are accepted.');if(new Set(rows.map(r=>r.date)).size!==rows.length)throw Error('Duplicate months in upload');if(!confirm('Confirm this file contains only permitted aggregate statistics or synthetic data, no taxpayer information. Replace active series?'))return;let sid=id();let raw=JSON.stringify(rows);s.source.push({id:sid,name:f.name,date:now(),count:rows.length,checksum:digest(raw)});s.obs=rows.map(r=>({date:r.date,value:Number(r.value),source:sid})).sort((a,b)=>a.date.localeCompare(b.date));log('Aggregate file imported',sid);render();toast('Imported '+rows.length+' observations')}catch(e){toast(e.message)}finally{$('file').value=''}};function render(){ $('nav').innerHTML=names.map((v,i)=>(groups[i]?`<p>${groups[i]}</p>`:'')+`<button class="${page===i?'active':''}" onclick="go(${i})">${icons[i]} &nbsp;${v}</button>`).join('');$('crumb').textContent='Workspace / '+names[page];let b='',r=latest(),sc=s.scenarios[0],o=s.opt;let intro=['Revenue outlook, evidence quality and decision operations.','Register sources, import aggregate observations and preserve provenance.','Inspect and export the active monthly aggregate series.','Define research model features, exclusions and versioned assumptions.','Run reproducible aggregate forecasts with transparent baseline methods.','Test the sensitivity of saved revenue forecasts to hypothetical changes.','Explore fictional case prioritization with transparent economic assumptions.','Allocate finite staff capacity across simulated interventions.','Explain saved results using deterministic, source-aware templates.','Record human decisions and local audit history.','Create evidence-linked research briefs after review.','Compare forecast methods on a chronological holdout.'][page];
const total=s.obs.reduce((a,b)=>a+b.value,0);if(page===0){b=`<div class="steps"><span>01 · MODEL</span><span>02 · PREDICT</span><span>03 · ASSESS & PRIORITIZE</span><span>04 · DELIVER</span></div><div class="grid">${metric('Aggregate receipts',money(total),'Active series total')}${metric('Observations',s.obs.length,'Monthly records')}${metric('Forecast runs',s.runs.length,'Saved versions')}${metric('Pending reviews',s.decisions.filter(d=>d.status==='Submitted').length,'Human oversight')}${metric('Live connectors',Object.values(s.connectors).filter(c=>c?.status==='Connected').length,'Treasury / FRED API')}</div><div class="grid two">${card('Revenue intelligence',chart(s.obs.map(x=>x.value))+btn('Open forecasting','go(4)'))}${card('Operational workflow',`<p>Evidence snapshots: <b>${s.source.length}</b></p><p>Scenarios saved: <b>${s.scenarios.length}</b></p><p>Synthetic cases: <b>${s.cases.length}</b></p><p>Reviewed briefs: <b>${s.reports.length}</b></p>${btn('Review center','go(9)')}`)}</div>${card('Workspace controls',btn('Export workspace','exportAll()')+' '+btn('Reset active workspace','resetSpace()')+' '+btn('Start analysis','go(1)',true))}`}

if(page===3)b=card('Model specification · v'+s.model.version,`<div class="formgrid">${field('Model name','mname',s.model.name,'text')}${field('Features','features',s.model.features,'text')}${field('Exclusions / limitations','notes',s.model.notes,'text')}</div><div class="toolbar">${btn('Save new specification version','saveModel()',true)}</div>`)+card('Research risk taxonomy',table(['Indicator','Interpretation','Boundary'],[['Receipt variance','Aggregate deviation','Not individual noncompliance'],['Seasonality','Recurring month patterns','Requires aligned data'],['Revenue shock','Hypothetical stress','Not observed fraud'],['Synthetic burden','Fictional intervention cost','Simulation only']]));
if(page===4)b=card('Configure forecast',`<div class="formgrid"><label>Forecast method<select id="method"><option>Seasonal naïve</option><option>Moving average</option><option>Last observation</option></select></label>${field('Horizon (months)','horizon',12,'number','min="1" max="24"')}<label>Active observations<input disabled value="${s.obs.length}"></label></div><div class="toolbar">${btn('Run forecast','runForecast()',true)}</div>`)+(r?card('Latest forecast · '+r.id,`<div class="grid two">${metric('First month',money(r.values[0]))}${metric('Horizon total',money(r.values.reduce((a,b)=>a+b,0)))}</div>${chart(r.values,r.high)}<small>Teal: forecast; amber: illustrative upper historical-error band. Not calibrated.</small>${table(['Period','Forecast','Lower band','Upper band'],r.values.map((v,i)=>[i+1,money(v),money(r.low[i]),money(r.high[i])]))}${btn('Create stress scenario','go(5)',true)}`):card('Forecast results','<p class="empty">Run an analysis to populate this panel.</p>'))+card('Run history',table(['Run','Method','Horizon','Version'],s.runs.map(x=>[esc(x.id),esc(x.method),x.h,x.version])));
if(page===5)b=card('Scenario assumptions',`<div class="formgrid">${field('Scenario name','sname','Revenue downside','text')}${field('Immediate shock (%)','shock',-10)}${field('Additional annual growth (%)','growth',2)}</div><p class="muted">Uses latest saved forecast: ${r?.id||'None'}</p>${btn('Execute and save scenario','scenario()',true)}`)+(sc?card('Latest scenario · '+esc(sc.name),chart(s.runs.find(x=>x.id===sc.run)?.values||[],sc.values)+`<p>Teal: baseline; amber: stress. Scenario total: <b>${money(sc.values.reduce((a,b)=>a+b,0))}</b></p>`):'')+card('Scenario history',table(['Name','Forecast','Shock','Growth'],s.scenarios.map(x=>[esc(x.name),esc(x.run),x.shock+'%',x.growth+'%'])));
if(page===6)b=space!=='demo'?card('Aggregate-only research mode','<p>Synthetic case operations are isolated in the simulation workspace. No individual scoring is available here.</p>'):card('Add fictional intervention candidate',`<div class="formgrid">${field('Issue probability (%)','prob',50)}${field('Recoverable value ($)','value',15000)}${field('Review cost ($)','cost',600)}${field('Staff hours','hours',4)}${field('Burden units','burden',2)}</div><div class="toolbar">${btn('Add simulated case','addCase()',true)}${btn('Optimize capacity','go(7)')}</div>`)+card('Ranked synthetic opportunities',table(['Case','Probability','Value','Cost','Hours','Net score ($100/unit)'],[...s.cases].sort((a,b)=>score(b)-score(a)).map(c=>[esc(c.id),num(c.p*100)+'%',money(c.value),money(c.cost),c.hours,money(score(c))])));
if(page===7)b=space!=='demo'?card('Simulation only','<p>Switch to the simulation workspace to evaluate fictional capacity allocation.</p>'):card('Capacity constrained optimization',`<div class="formgrid">${field('Total staff hours','capacity',o?.capacity??60)}${field('Burden penalty ($/unit)','penalty',o?.lambda??100)}</div><p>Exact integer-hour knapsack maximizes expected recoverable value less cost and burden penalty. Synthetic only.</p>${btn('Solve allocation','solve()',true)}`)+(o?card('Optimization result',`<div class="grid">${metric('Selected',o.ids.length)}${metric('Staff hours',o.hours+' / '+o.capacity)}${metric('Expected net value',money(o.value))}${metric('Unused capacity',o.capacity-o.hours)}</div>${table(['Case','Hours','Net value'],s.cases.filter(c=>o.ids.includes(c.id)).map(c=>[esc(c.id),c.hours,money(score(c,o.lambda))]))}`):'');
if(page===8)b=card('Groq AI copilot',`<p class="banner">${cfg.groqKey?.trim()?'Groq live mode: responses grounded on workspace JSON context. Human review required before publication.':'No Groq key — using deterministic local templates. Add a key in Data Integration Hub.'}</p>${s.chat.map(x=>`<div class="card"><b>${esc(x.q)}</b><p>${esc(x.a)}</p><small>${esc(x.date)} · ${esc(x.engine||'local')}</small></div>`).join('')}<label>Ask about saved forecasts, scenarios, optimization, or data provenance<textarea id="question" placeholder="Draft a sourced explanation of the latest forecast and limitations"></textarea></label><div class="toolbar">${btn('Generate explanation','copilot()',true)} ${btn('Integration settings','go(1)')}</div><p class="muted">Numerical scores and forecasts come from deterministic code paths; Groq is advisory only (blueprint §6.4).</p>`);

function obsTable(a){return table(['Month','Receipts (USD)','Source'],a.map(x=>[esc(x.date),money(x.value),esc(x.source)]))}function filterObs(){let a=input('from'),b=input('to');$('observations').innerHTML=obsTable(s.obs.filter(x=>(!a||x.date>=a)&&(!b||x.date<=b)))}function exportObs(){let a=input('from'),b=input('to');download('observations.csv','date,value,source\n'+s.obs.filter(x=>(!a||x.date>=a)&&(!b||x.date<=b)).map(x=>[x.date,x.value,x.source].join(',')).join('\n'),'text/csv')}function sample(){download('sample.csv','date,value\n2025-01,250000000000\n2025-02,280000000000','text/csv')}function resetSpace(){if(confirm('Reset only the active workspace? Export first if needed.')){s=fresh(space==='demo');save();render()}}function downloadReport(i){download('tax-prime-brief-'+s.reports[i].id+'.txt',reportText(s.reports[i]),'text/plain')}load();render();</script></body></html>
